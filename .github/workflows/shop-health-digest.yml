name: Shop health digest

# One line per shop, every shop, every run: not exception-only. Exception-only
# alerting needs stored state to detect transitions, and makes silence
# ambiguous between "everything's fine" and "the job is broken." A received
# email is its own heartbeat, and a missing one is the signal to check this
# workflow (see keep-api-awake.yml for this repo's prior experience with
# GitHub's `schedule` trigger under-delivering — a digest landing a few hours
# late on its day matters far less than that did, so no retry loop here).
#
# Reads ops.shop_health through a dedicated read-only role (OPS_DATABASE_URL),
# never the read-write DATABASE_URL/PROD_DATABASE_URL — see migration 0016.
#
# To pause without editing anything: disable this workflow from the repo's
# Actions tab, or set the DIGEST_ENABLED repository variable to "false" (the
# script checks it and exits before querying anything). Either one undoes
# just as easily.
on:
  schedule:
    - cron: '17 14 * * 1,3,5' # Mon/Wed/Fri, ~6-7am Pacific
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
      - run: npm ci
      - run: npm run digest -w @tallyup/api
        env:
          OPS_DATABASE_URL: ${{ secrets.OPS_DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_ENABLED: ${{ vars.DIGEST_ENABLED }}
